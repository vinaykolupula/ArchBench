archbench:
  spec_version: "0.1"
  project: realtime-chat-spof
  description: SPOF in Message Ingress
  authors:
    - ArchBench Benchmark Suite
system:
  context:
    users:
      - id: end-user
        name: End User
    external_systems: []
  requirements:
    - id: REQ-01
      category: functional
      priority: must
      statement: Process Message requests.
      verification: architecture_check
  constraints:
    - id: CON-001
      category: operational
      statement: Production deployable within corporate cloud boundaries.
  assumptions:
    - id: ASM-001
      statement: Expected traffic patterns follow daily diurnal cycles.
      status: confirmed
      confidence: high
      impact_if_false: medium
architecture:
  alternatives:
    - id: spof-alternative
      name: Single Replica Articulation Point
      description: Gateway with 1 replica; SPOF.
      components:
        - id: chat-gw
          name: Message Gateway
          type: api_gateway
          technology: Envoy
          responsibility: Single gateway instance.
          requirements:
            - REQ-01
          deployment:
            replicas: 1
        - id: chat-svc
          name: Message Service
          type: service
          technology: Go
          responsibility: Backend logic.
          deployment:
            replicas: 3
        - id: chat-db
          name: Message Store
          type: relational_database
          technology: PostgreSQL
          responsibility: Datastore.
          data:
            ownership: chat-domain
          deployment:
            replicas: 2
      connections:
        - id: c17-user-gw
          from: end-user
          to: chat-gw
          protocol: synchronous
          transport: https
        - id: c17-gw-svc
          from: chat-gw
          to: chat-svc
          protocol: synchronous
          transport: http
        - id: c17-svc-db
          from: chat-svc
          to: chat-db
          protocol: synchronous
          transport: tcp
