archbench:
  spec_version: "0.1"
  project: notification-platform-prod
  description: Resilient Asynchronous Notification System with Outbox and DLQ
  authors:
    - ArchBench Benchmark Suite
system:
  context:
    users:
      - id: end-user
        name: End User
    external_systems:
      - id: email-gateway
        name: SendGrid Email Provider
        category: external_provider
  requirements:
    - id: REQ-01
      category: functional
      priority: must
      statement: Send multi-channel notifications.
      verification: architecture_check
    - id: NFR-01
      category: throughput
      priority: must
      statement: 10,000 notifications/sec
      verification: architecture_check
      target:
        rps: 10000
  constraints:
    - id: CON-001
      category: operational
      statement: Production deployable within corporate cloud boundaries.
  assumptions:
    - id: ASM-001
      statement: Expected traffic patterns follow daily diurnal cycles.
      status: confirmed
      confidence: high
      impact_if_false: medium
architecture:
  alternatives:
    - id: resilient-pipeline
      name: Outbox Queue Worker Pipeline
      description: Decoupled pipeline with outbox pattern, idempotent workers, and DLQ.
      decisions:
        - id: ADR-001
          title: Transactional Outbox Pattern
          choice: Use transactional outbox to prevent dual writes.
          context: Prevent dual write inconsistencies between PostgreSQL and RabbitMQ.
          status: accepted
      components:
        - id: notify-api
          name: Notification Ingress API
          type: service
          technology: Go
          responsibility: Accepts requests and saves to Outbox table.
          requirements:
            - REQ-01
            - NFR-01
          deployment:
            replicas: 3
        - id: notify-db
          name: PostgreSQL Database
          type: relational_database
          technology: PostgreSQL 16
          responsibility: Holds notifications and outbox events.
          data:
            ownership: notification-domain
          deployment:
            replicas: 2
        - id: notify-queue
          name: RabbitMQ Notification Queue
          type: message_queue
          technology: RabbitMQ
          responsibility: Buffers notification messages.
          messaging:
            overload_policy: drop_head_after_alarm
            delivery_semantics: at_least_once
        - id: notify-dlq
          name: Dead Letter Queue
          type: message_queue
          technology: RabbitMQ DLQ
          responsibility: Dead letter quarantine.
          messaging:
            overload_policy: alert_operator
        - id: dispatch-worker
          name: Dispatch Worker
          type: background_worker
          technology: Node.js
          responsibility: Consumes messages, dedupes, and invokes third party email provider.
          requirements:
            - REQ-01
          deployment:
            replicas: 4
          behavior:
            idempotent: true
            idempotency_key: notification_id
            retry_policy:
              max_attempts: 3
              backoff: exponential
              dead_letter_target: notify-dlq
      connections:
        - id: c06-user-api
          from: end-user
          to: notify-api
          protocol: synchronous
          transport: https
        - id: c06-api-db
          from: notify-api
          to: notify-db
          protocol: synchronous
          transport: tcp
        - id: c06-api-queue
          from: notify-api
          to: notify-queue
          protocol: asynchronous
          transport: amqp
        - id: c06-queue-worker
          from: notify-queue
          to: dispatch-worker
          protocol: asynchronous
          transport: amqp
        - id: c06-worker-gw
          from: dispatch-worker
          to: email-gateway
          protocol: synchronous
          transport: https
