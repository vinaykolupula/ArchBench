archbench:
  spec_version: "0.1"
  project: multitenant-saas-shared-db
  description: Shared Database Coupling for TenantWorkspace
  authors:
    - ArchBench Benchmark Suite
system:
  context:
    users:
      - id: end-user
        name: End User
    external_systems: []
  requirements:
    - id: REQ-01
      category: functional
      priority: must
      statement: Manage TenantWorkspace state.
      verification: architecture_check
  constraints:
    - id: CON-001
      category: operational
      statement: Production deployable within corporate cloud boundaries.
  assumptions:
    - id: ASM-001
      statement: Expected traffic patterns follow daily diurnal cycles.
      status: confirmed
      confidence: high
      impact_if_false: medium
architecture:
  alternatives:
    - id: shared-db-alt
      name: Shared Database Anti-Pattern
      description: Two services directly mutating the same database.
      components:
        - id: tenant-read-svc
          name: TenantWorkspace Query Service
          type: service
          technology: Go
          responsibility: Query service.
          requirements:
            - REQ-01
          deployment:
            replicas: 2
        - id: tenant-write-svc
          name: TenantWorkspace Mutation Service
          type: service
          technology: Java
          responsibility: Write service.
          requirements:
            - REQ-01
          deployment:
            replicas: 2
        - id: tenant-master-db
          name: TenantWorkspace Shared Database
          type: relational_database
          technology: PostgreSQL 16
          responsibility: Shared datastore.
          data:
            ownership: tenant-domain
          deployment:
            replicas: 2
      connections:
        - id: c44-user-read
          from: end-user
          to: tenant-read-svc
          protocol: synchronous
          transport: https
        - id: c44-user-write
          from: end-user
          to: tenant-write-svc
          protocol: synchronous
          transport: https
        - id: c44-read-db
          from: tenant-read-svc
          to: tenant-master-db
          protocol: synchronous
          transport: tcp
        - id: c44-write-db
          from: tenant-write-svc
          to: tenant-master-db
          protocol: synchronous
          transport: tcp
