archbench:
  spec_version: "0.1"
  project: payment-ledger-non-idempotent
  description: Non-idempotent Consumer for Transaction
  authors:
    - ArchBench Benchmark Suite
system:
  context:
    users:
      - id: end-user
        name: End User
    external_systems: []
  requirements:
    - id: REQ-01
      category: functional
      priority: must
      statement: Process Transaction events.
      verification: architecture_check
  constraints:
    - id: CON-001
      category: operational
      statement: Production deployable within corporate cloud boundaries.
  assumptions:
    - id: ASM-001
      statement: Expected traffic patterns follow daily diurnal cycles.
      status: confirmed
      confidence: high
      impact_if_false: medium
architecture:
  alternatives:
    - id: non-idempotent-alt
      name: Unsafe Consumer Under Duplicate Delivery
      description: Worker on at-least-once queue without idempotency.
      components:
        - id: ledger-queue
          name: Transaction Queue
          type: message_queue
          technology: Kafka
          responsibility: Event streaming.
          messaging:
            overload_policy: bounded_retention
            delivery_semantics: at_least_once
        - id: ledger-worker
          name: Transaction Worker
          type: background_worker
          technology: Python
          responsibility: Worker processing Transaction.
          requirements:
            - REQ-01
          deployment:
            replicas: 3
          behavior:
            idempotent: false
      connections:
        - id: c33-user-queue
          from: end-user
          to: ledger-queue
          protocol: asynchronous
          transport: kafka
        - id: c33-queue-worker
          from: ledger-queue
          to: ledger-worker
          protocol: asynchronous
          transport: kafka
